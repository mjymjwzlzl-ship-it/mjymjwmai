worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use iocp;  # Windows 최적화
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 성능 최적화 설정
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    reset_timedout_connection on;
    client_body_timeout 10;
    send_timeout 10;

    # 버퍼 크기 최적화
    client_body_buffer_size 128k;
    client_max_body_size 50M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    output_buffers 1 32k;
    postpone_output 1460;

    # Gzip 압축 (속도 향상)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml application/atom+xml image/svg+xml 
               text/x-js text/x-cross-domain-policy application/x-font-ttf 
               application/x-font-opentype application/vnd.ms-fontobject 
               image/x-icon;
    gzip_disable "msie6";

    # 캐시 설정 (속도 대폭 향상)
    proxy_cache_path C:/nginx/cache levels=1:2 keys_zone=cache_zone:100m max_size=1g inactive=60m use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 302 60m;
    proxy_cache_valid 404 1m;
    proxy_cache_methods GET HEAD;

    # 업스트림 설정 (로드 밸런싱 & 연결 풀링)
    upstream backend {
        least_conn;
        server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend {
        least_conn;
        server 127.0.0.1:4000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream creator {
        server 127.0.0.1:4001 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream admin {
        server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # 메인 사이트
    server {
        listen 80;
        listen [::]:80;
        server_name arata.co.kr www.arata.co.kr localhost;

        # 액세스 로그 비활성화 (성능 향상)
        access_log off;
        error_log C:/nginx/logs/error.log crit;

        # 보안 헤더
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # 정적 파일 캐싱 (속도 향상)
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri @frontend;
        }

        # WebP 이미지 최적화
        location ~* \.(jpg|jpeg|png)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept";
            try_files $uri.webp $uri @frontend;
        }

        # API 프록시 (백엔드)
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            
            # 연결 재사용 (속도 향상)
            proxy_set_header Connection "";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 캐싱 설정
            proxy_cache cache_zone;
            proxy_cache_bypass $http_cache_control;
            add_header X-Cache-Status $upstream_cache_status;
            
            # 타임아웃 설정
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            
            # 버퍼링 최적화
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # Frontend API 프록시 (프로덕션용)
        location /frontend/ {
            proxy_pass http://backend/api/frontend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # GET 요청만 캐싱
            proxy_cache cache_zone;
            proxy_cache_valid 200 5m;
            add_header X-Cache-Status $upstream_cache_status;
        }
        
        # Frontend API 프록시 (개발용)
        location /api/frontend/ {
            proxy_pass http://backend/api/frontend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # GET 요청만 캐싱
            proxy_cache cache_zone;
            proxy_cache_valid 200 5m;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # 이미지 파일 직접 서빙 (백엔드)
        location /images/ {
            proxy_pass http://backend/images/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # 이미지 캐싱 (1달)
            proxy_cache cache_zone;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Next.js 정적 파일
        location /_next/ {
            proxy_pass http://frontend/_next/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # 정적 파일 캐싱
            proxy_cache cache_zone;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
        
        # 웹툰/코믹 페이지 (모든 동적 라우팅)
        location ~ ^/(webtoons|comic|adult|popular|official|new|user|creator|settings|signup|login|coin)(/.*)?$ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 404 에러 시 프론트엔드로 전달
            proxy_intercept_errors off;
        }

        # Next.js 프론트엔드 (기본)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 프론트엔드 캐싱
            proxy_cache cache_zone;
            proxy_cache_valid 200 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        }

        # WebSocket 지원
        location /_next/webpack-hmr {
            proxy_pass http://frontend/_next/webpack-hmr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 작가 센터
    server {
        listen 80;
        server_name creator.arata.co.kr;

        location / {
            proxy_pass http://creator;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # API 프록시
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }

    # 관리자 센터
    server {
        listen 80;
        server_name admin.arata.co.kr;

        location / {
            proxy_pass http://admin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # API 프록시
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}